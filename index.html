<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novelverse</title>
<style>
:root{--bg:#f4f3fa;--surface:#fff;--ink:#1b1840;--mute:#6a6890;--line:#dedcf0;--accent:#5b3fd6;--on:#fff;--gold:#b7791f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e24;--surface:#1a1838;--ink:#eceaff;--mute:#a09ec8;--line:#2e2b57;--accent:#9d86ff;--on:#12102b;--gold:#f0b95a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e24;--surface:#1a1838;--ink:#eceaff;--mute:#a09ec8;--line:#2e2b57;--accent:#9d86ff;--on:#12102b;--gold:#f0b95a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:70px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font:700 24px Georgia,"Times New Roman",serif;letter-spacing:-.5px;background:none;border:0;padding:0}
.logo b{color:var(--accent)}
.tr{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px}
#q{width:100%;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 14px;font-size:14px}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
main{padding:16px;max-width:720px;margin:0 auto}
h2{font-size:22px;margin:20px 0 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.card{flex:none;width:130px;background:none;border:0;padding:0;text-align:left}
.cover{aspect-ratio:3/4;border-radius:10px;display:flex;align-items:flex-end;padding:10px;color:#fff;font:700 18px/1.15 Georgia,"Times New Roman",serif;box-shadow:0 2px 8px rgba(20,10,60,.25)}
.card p{margin:6px 0 0;font-size:14px;font-weight:500}
.card small,.meta{color:var(--mute);font-size:13px}
.item{display:flex;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;text-align:left}
.item .cover{width:72px;flex:none;font-size:12px;padding:6px}
.item h3{font-size:17px}
.item p{margin:4px 0 0;font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.star,.lk{color:var(--gold);font-weight:700}
.lk{font-size:13px}
.hero{display:flex;gap:16px}
.hero .cover{width:120px;flex:none}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.acts{display:flex;gap:10px;margin:16px 0}
.acts .btn{flex:1}
.ch{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;text-align:left}
.read{font-family:Georgia,"Times New Roman",serif;line-height:1.75}
.read p{margin:0 0 1em}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
.bar .btn{padding:8px 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:12px 2px;font-size:13px;font-weight:500;color:var(--mute)}
nav button.on{color:var(--accent);font-weight:700}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.form textarea,select{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;width:100%}
.err{color:#d6455d;font-size:14px;min-height:1.2em}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font:700 24px Georgia,"Times New Roman",serif}
.stats small{color:var(--mute)}
.pb{height:8px;background:var(--line);border-radius:6px;margin:8px 0;overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent)}
.pn{border-radius:8px;margin-bottom:8px;display:flex;align-items:flex-end;padding:12px;color:#fff;font:500 15px Georgia,"Times New Roman",serif}
#ts{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="brand"><button class="logo" onclick="go('home')">Novel<b>verse</b></button><div class="tr"><button class="tbtn" id="wl" onclick="go('quests')" style="display:none"></button><button class="tbtn" id="tg">Theme</button><button class="tbtn" id="ac" onclick="go('auth')">Log in</button></div></div>
  <input id="q" type="search" placeholder="Search novels, manga or authors" aria-label="Search">
  <div class="chips" id="chips"></div>
</header>
<main id="app"></main>
<nav id="nv"></nav>
<div id="ts"></div>
<script>
const G=['All','Fantasy','Romance','Sci-Fi','Mystery','Action'],TK=1,CO=5;
const SEED=['The wind came in off the water before dawn, carrying the smell of salt and something older.','Nobody had warned her that the quiet would be the loudest part.','He read the message three times, then set the phone face down and stared at the ceiling.','By the time the sun cleared the ridge, the decision had already been made for them.','There is a kind of silence that only arrives right before everything changes.','She counted her steps down the corridor, because counting was easier than being afraid.','The map was wrong, and the more they walked, the more certain they were that it was wrong on purpose.','Somewhere behind the wall, a small machine ticked, patient as a held breath.'];
const S=[
['The Last Lantern Keeper','Mira Okoye','Fantasy',4.8,262,[265,300],'A lighthouse keeper discovers her lantern guards a door between worlds, and something is knocking.'],
['Letters to a Quiet Star','Daniel Reyes','Romance',4.7,148,[335,20],'Two strangers share one unsent letter app across two time zones and slowly fall for each other.'],
['Orbit of Ash','Tavi Lindqvist','Sci-Fi',4.6,301,[200,250],'When Earth goes silent, a salvage pilot finds the only working signal coming from inside a dead moon.'],
['The Ninth Chair','Ayo Bankole','Mystery',4.5,96,[160,205],'Eight scholars gather for dinner. A ninth chair is set, and nobody remembers who it belongs to.'],
['Sword of the Pale Tide','Keiko Arai','Action',4.7,410,[10,330],'An exiled swordswoman leads a ragged crew against an empire that rules the sea itself.'],
['Moonlit Contract','Sofia Marchetti','Romance',4.4,121,[285,330],'A fox spirit needs a human partner for one year, and she picked the wrong person to ask.'],
['Clockwork Heirs','Jonas Weber','Fantasy',4.6,188,[30,350],'In a city powered by wound hearts, a street thief inherits the one clock that cannot stop.'],
['Static Garden','Priya Nair','Sci-Fi',4.5,74,[140,190],'Botanists on a dying ship begin hearing the plants speak in a language that predicts the future.'],
['Ink and Thunder','Haruki Sato','Action',4.8,57,[240,280],'A calligrapher whose brushstrokes become lightning enters the city tournament to save her school.',1],
['Paper Moon Café','Lena Cho','Romance',4.6,31,[320,15],'A night café only appears to people who are lonely, and its new barista is a retired ghost.',1],
['Neon Ronin','Kaito Mori','Sci-Fi',4.7,83,[170,260],'A masterless android samurai guards a rooftop market in a city that never sees the sun.',1],
['The Hollow Gallery','Nia Adeyemi','Mystery',4.5,19,[45,330],'Every painting in the new gallery shows a room that exists only inside the building.',1]
].map((a,i)=>({id:'s'+i,t:a[0],a:a[1],g:a[2],r:a[3],n:a[4],h:a[5],d:a[6],m:a[7]||0,lock:a[7]?5:50}));
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const ldj=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
let users=ldj('nv-users','{}'),UW=ldj('nv-works','[]'),me=null,fs=18,state={v:'home',g:'All',id:null,c:0,p:0,q:'',m:'li',rd:false};
try{me=localStorage.getItem('nv-me')}catch(e){}
if(!users[me])me=null;
Object.values(users).forEach(x=>{x.lib=(x.lib||[]).map(i=>typeof i==='number'?'s'+i:i);x.tk=x.tk??2;x.co=x.co??0;x.un=x.un||[];x.q=x.q||{}});
function sv(){try{localStorage.setItem('nv-users',JSON.stringify(users));localStorage.setItem('nv-works',JSON.stringify(UW));me?localStorage.setItem('nv-me',me):localStorage.removeItem('nv-me')}catch(e){}}
const u=()=>users[me],lib=()=>me?u().lib:[];
const W=()=>S.concat(UW),gw=id=>W().find(w=>w.id===id),cnt=w=>w.chs?w.chs.length:w.n;
const hs=t=>[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const cov=w=>`background:linear-gradient(155deg,hsl(${w.h[0]} 60% 38%),hsl(${w.h[1]} 65% 24%))`;
const lab=(w,c)=>w.chs?(c+1)+'. '+w.chs[c].t:'Chapter '+(c+1);
const locked=(w,c)=>c+1>=w.lock&&!(me&&(w.own===me||u().un.includes(w.id+':'+c)));
const dayq=()=>{const x=u();if(x.q.d!==new Date().toDateString())x.q={d:new Date().toDateString(),rt:0,ch:0,cl:[],opened:[]}};
const QS=[{id:'in',t:'Daily check-in',r:1,p:q=>1,l:q=>'Ready to claim'},{id:'r5',t:'Read for 5 minutes',r:2,p:q=>q.rt/300,l:q=>fmt(Math.min(q.rt,300))+' / 5:00'},{id:'r10',t:'Read for 10 minutes',r:4,p:q=>q.rt/600,l:q=>fmt(Math.min(q.rt,600))+' / 10:00'},{id:'c3',t:'Open 3 chapters',r:1,p:q=>q.ch/3,l:q=>Math.min(q.ch,3)+' / 3'}];
function toast(m){const t=$('#ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200)}
function go(v,id,c){state.v=v;if(id!==undefined)state.id=id;if(c!==undefined)state.c=c;if(v==='book')state.p=0;render();scrollTo(0,0)}
const rt=w=>w.r?'<span class="star">★ '+w.r+'</span>':'New';
const card=w=>`<button class="card" onclick="go('book','${w.id}')"><div class="cover" style="${cov(w)}">${esc(w.t)}</div><p>${esc(w.t)}</p><small>${w.m?'Manga':w.g} · ${rt(w)}</small></button>`;
const item=w=>`<button class="item" onclick="go('book','${w.id}')"><div class="cover" style="${cov(w)}">${esc(w.t)}</div><div><h3>${esc(w.t)}</h3><div class="meta">${esc(w.a)} · ${w.m?'Manga':'Novel'} · ${w.g} · ${rt(w)}</div><p>${esc(w.d)}</p></div></button>`;
const login=msg=>`<div class="empty">${msg}<div class="acts"><button class="btn" onclick="state.m='li';go('auth')">Log in</button><button class="btn alt" onclick="state.m='su';go('auth')">Sign up</button></div></div>`;
const opts=sel=>G.slice(1).map(g=>'<option'+(g===sel?' selected':'')+'>'+g+'</option>').join('');
function chNav(w,c){return `<div class="acts"><button class="btn alt" ${c?'':'disabled'} onclick="go('read','${w.id}',${c-1})">Previous</button><button class="btn" ${c+1<cnt(w)?'':'disabled'} onclick="go('read','${w.id}',${c+1})">Next chapter</button></div><button class="btn alt" style="width:100%" onclick="go('book','${w.id}')">Back to chapters</button>`}
const V={
home(){const t=state.q.toLowerCase(),g=state.g,ids=W().filter(w=>(g==='All'||w.g===g)&&(w.t+w.a).toLowerCase().includes(t));
 if(t||g!=='All')return `<h2>${t?'Results':g}</h2>`+(ids.length?ids.map(item).join(''):'<div class="empty">No titles match. Try another genre or keyword.</div>');
 const nv=ids.filter(w=>!w.m),fv=me&&u().fav,pk=fv?nv.filter(w=>w.g===fv):[];
 return (me?`<h1 style="font-size:26px">Welcome back, ${esc(u().name.split(' ')[0])}</h1>`:`<div class="item" style="display:block"><b>Join Novelverse</b><p>Read free, earn tokens with daily quests, or publish your own novel or manga.</p><div class="acts" style="margin:10px 0 0"><button class="btn" onclick="state.m='su';go('auth')">Sign up</button><button class="btn alt" onclick="state.m='li';go('auth')">Log in</button></div></div>`)
 +(pk.length?`<h2>Picked for you: ${fv}</h2><div class="row">${pk.map(card).join('')}</div>`:'')
 +`<h2>Featured novels</h2><div class="row">${[...nv].sort((a,b)=>b.r-a.r).slice(0,6).map(card).join('')}</div><h2>Manga to read</h2><div class="row">${ids.filter(w=>w.m).map(card).join('')}</div><h2>Trending novels</h2>${nv.map(item).join('')}`},
manga(){const l=W().filter(w=>w.m&&(state.g==='All'||w.g===state.g));return `<h2>Manga</h2><p class="meta">Chapters 5 and up are locked. Unlock them with tokens or coins.</p>`+(l.length?l.map(item).join(''):'<div class="empty">No manga in this genre yet.</div>')},
book(){const w=gw(state.id),n=cnt(w),a=state.p,lo=a*50,hi=Math.min(n,lo+50),inL=lib().includes(w.id);
 const pg=n>50?'<div class="chips">'+Array.from({length:Math.ceil(n/50)},(_,i)=>`<button class="chip ${i===a?'on':''}" onclick="state.p=${i};render()">${i*50+1}-${Math.min(n,i*50+50)}</button>`).join('')+'</div>':'';
 let rows='';for(let c=lo;c<hi;c++){const L=locked(w,c),f=c+1>=w.lock;rows+=`<button class="ch" onclick="go('read','${w.id}',${c})"><span>${esc(lab(w,c))}</span><span class="${L?'lk':'meta'}">${L?'Locked':f?'Unlocked':'Free'}</span></button>`}
 return `<div class="hero"><div class="cover" style="${cov(w)}">${esc(w.t)}</div><div><h1>${esc(w.t)}</h1><div class="meta">${esc(w.a)}<br>${w.m?'Manga':'Novel'} · ${w.g} · ${n} chapters</div><div style="margin-top:6px">${rt(w)}</div></div></div><p>${esc(w.d)}</p>
 <div class="acts"><button class="btn" ${n?'':'disabled'} onclick="go('read','${w.id}',0)">Start reading</button><button class="btn alt" onclick="tl('${w.id}')">${inL?'Saved to library':'Add to library'}</button></div>
 <p class="meta">${w.own===me&&me?'You are the author, so every chapter is free for you.':n>=w.lock?`Chapters ${w.lock} and up are locked. Unlock one with ${TK} token or ${CO} coins.`:'All chapters are free.'}</p><h2>Chapters</h2>${n?pg+rows:'<div class="empty">The author has not published any chapters yet.</div>'}`},
read(){const w=gw(state.id),c=state.c;state.rd=false;
 const head=`<div class="meta">${esc(w.t)}</div><h1>${esc(lab(w,c))}</h1>`;
 if(locked(w,c)){if(!me)return head+login('This chapter is locked. Log in to unlock it with tokens or coins.');const x=u();
  return head+`<div class="item" style="display:block;margin-top:14px"><b>Chapter ${c+1} is locked</b><p>Unlock it with a free token or with coins. Authors earn from every unlock.</p><div class="acts" style="flex-wrap:wrap"><button class="btn" onclick="unlock('${w.id}',${c},'t')">Use ${TK} token (you have ${x.tk})</button><button class="btn alt" onclick="unlock('${w.id}',${c},'c')">Use ${CO} coins (you have ${x.co})</button></div><button class="btn alt" style="width:100%" onclick="go('quests')">Earn free tokens</button></div>`+chNav(w,c)}
 state.rd=true;if(me){const q=u().q,k=w.id+':'+c;if(!q.opened.includes(k)){q.opened.push(k);q.ch++;sv()}}
 const k=w.chs?0:+w.id.slice(1),tx=w.chs?w.chs[c].x.split(/\n+/):Array.from({length:w.m?6:5},(_,i)=>SEED[(k*3+c*2+i)%SEED.length]+' '+SEED[(k+c+i*3+1)%SEED.length]);
 const body=w.m?tx.map((t,i)=>`<div class="pn" style="height:${w.chs?'auto;min-height:':''}${170+(i*53)%110}px;background:linear-gradient(${150+i*25}deg,hsl(${(w.h[0]+i*18)%360} 55% 40%),hsl(${w.h[1]} 60% 22%))">${esc(t.split('. ')[0])}</div>`).join(''):`<div class="bar"><button class="btn alt" onclick="fs=Math.max(14,fs-2);render()">A−</button><button class="btn alt" onclick="fs=Math.min(30,fs+2);render()">A+</button></div><div class="read" style="font-size:${fs}px">${tx.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
 return head+(me?`<div class="meta">Reading today: <span id="rt">${fmt(u().q.rt)}</span></div>`:'<div class="meta">Log in to earn tokens while you read.</div>')+body+chNav(w,c)},
lib(){if(!me)return '<h2>Your library</h2>'+login('Log in to save titles.');const l=lib().map(gw).filter(Boolean);return '<h2>Your library</h2>'+(l.length?l.map(item).join(''):'<div class="empty">Nothing saved yet. Open a title and tap Add to library.</div>')},
quests(){if(!me)return '<h2>Quests</h2>'+login('Log in to earn free tokens by reading.');const x=u(),q=x.q;
 return `<h2>Wallet</h2><div class="stats"><div><b>${x.tk}</b><small>tokens</small></div><div><b>${x.co}</b><small>coins</small></div></div><p class="meta">A token unlocks one chapter. Quests reset every day.</p><h2>Daily quests</h2>`
 +QS.map(d=>{const p=d.p(q),dn=q.cl.includes(d.id);return `<div class="item" style="display:block"><b>${d.t}</b> <span class="star">+${d.r} token${d.r>1?'s':''}</span><div class="pb"><i style="width:${Math.min(1,p)*100}%"></i></div><div class="meta">${d.l(q)}</div><button class="btn" style="margin-top:8px" ${dn||p<1?'disabled':''} onclick="claim('${d.id}')">${dn?'Claimed':p<1?'In progress':'Claim reward'}</button></div>`}).join('')
 +`<h2>Get coins</h2><div class="acts"><button class="btn alt" onclick="buy(50)">50 coins</button><button class="btn alt" onclick="buy(120)">120 coins</button></div><p class="meta">Demo only: no real payment is taken. A live site would use a payment provider.</p>`},
write(){if(!me)return '<h2>Author hub</h2>'+login('Log in to publish your own novels and manga and earn from locked chapters.');
 const m=UW.filter(w=>w.own===me),sm=k=>m.reduce((s,w)=>s+(w[k]||0),0);
 return `<h2>Author hub</h2><div class="stats"><div><b>${sm('ern')}</b><small>coins earned</small></div><div><b>${m.length}</b><small>works</small></div><div><b>${sm('unl')}</b><small>unlocks</small></div></div><div class="acts"><button class="btn" onclick="go('nw')">Create a new work</button></div>`
 +(m.length?m.map(w=>`<button class="item" onclick="go('mw','${w.id}')"><div class="cover" style="${cov(w)}">${esc(w.t)}</div><div><h3>${esc(w.t)}</h3><div class="meta">${w.m?'Manga':'Novel'} · ${w.chs.length} chapters · locks from ${w.lock}</div><p>${w.ern||0} coins earned from ${w.unl||0} unlocks</p></div></button>`).join(''):'<div class="empty">You have not published anything yet.</div>')
 +`<p class="meta">Authors earn 3 coins for each coin unlock and 1 coin for each token unlock.</p>`},
nw(){return `<h2>New work</h2><div class="form"><input id="wt" placeholder="Title"><select id="wm" onchange="$('#wl').value=this.value==='1'?5:50"><option value="0">Novel</option><option value="1">Manga</option></select><select id="wg">${opts('Fantasy')}</select><textarea id="wd" rows="3" placeholder="Short synopsis"></textarea><label class="meta">Lock chapters from chapter number (novels usually 50, manga usually 5)</label><input id="wl" type="number" min="1" value="50"><div id="er" class="err"></div><button class="btn" onclick="createW()">Create work</button><button class="btn alt" onclick="go('write')">Cancel</button></div>`},
mw(){const w=gw(state.id);return `<h2>${esc(w.t)}</h2><div class="stats"><div><b>${w.chs.length}</b><small>chapters</small></div><div><b>${w.unl||0}</b><small>unlocks</small></div><div><b>${w.ern||0}</b><small>coins</small></div></div>
 <h2>Paywall</h2><div class="form"><label class="meta">Chapters from this number are locked</label><input id="wl" type="number" min="1" value="${w.lock}"><button class="btn alt" onclick="setLock()">Save lock setting</button></div>
 <h2>Publish chapter ${w.chs.length+1}</h2><div class="form"><input id="ct" placeholder="Chapter title"><textarea id="cx" rows="8" placeholder="${w.m?'One page caption per line. Image upload needs a live backend.':'Write your chapter here'}"></textarea><div id="er" class="err"></div><button class="btn" onclick="addCh()">Publish chapter</button><button class="btn alt" onclick="go('book','${w.id}')">View as reader</button></div>`},
auth(){const su=state.m==='su';return me?`<h2>Hi, ${esc(u().name)}</h2><p class="meta">${esc(me)}</p><label class="meta">Favorite genre</label><select onchange="u().fav=this.value;sv()">${opts(u().fav)}</select><div class="acts"><button class="btn alt" onclick="out()">Log out</button></div>`
 :`<h2>${su?'Create your account':'Log in'}</h2><div class="form">${su?'<input id="nm" placeholder="Display name" autocomplete="name">':''}<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)">${su?'<label class="meta">Favorite genre</label><select id="fv">'+opts('Fantasy')+'</select>':''}<div id="er" class="err"></div><button class="btn" onclick="submit()">${su?'Sign up and get 3 free tokens':'Log in'}</button><button class="btn alt" onclick="state.m='${su?'li':'su'}';render()">${su?'I already have an account':'Create an account'}</button></div><p class="meta">Prototype: accounts are saved only in this browser.</p>`}
};
const NV=[['home','Home'],['manga','Manga'],['quests','Quests'],['lib','Library'],['write','Write']];
function render(){
 if(me)dayq();const s=state;
 $('#ac').textContent=me?u().name.split(' ')[0]:'Log in';
 const wl=$('#wl');wl.style.display=me?'':'none';if(me)wl.textContent=u().tk+' tokens';
 let k={home:'home',book:'home',read:'home',manga:'manga',quests:'quests',lib:'lib',write:'write',nw:'write',mw:'write'}[s.v]||'';
 if((s.v==='book'||s.v==='read')&&gw(s.id).m)k='manga';
 $('#nv').innerHTML=NV.map(n=>`<button class="${n[0]===k?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
 $('#chips').style.display=(s.v==='home'||s.v==='manga')?'flex':'none';
 $('#chips').innerHTML=G.map(g=>`<button class="chip ${g===s.g?'on':''}" onclick="state.g='${g}';render()">${g}</button>`).join('');
 s.rd=false;$('#app').innerHTML=V[s.v]();
}
function tl(id){if(!me){state.m='li';go('auth');return}const x=u();x.lib=x.lib.includes(id)?x.lib.filter(i=>i!==id):[...x.lib,id];sv();render()}
function unlock(id,c,mode){const w=gw(id),x=u();
 if(mode==='t'){if(x.tk<TK){toast('Not enough tokens. Try a quest.');return}x.tk-=TK;if(w.own)w.ern=(w.ern||0)+1}
 else{if(x.co<CO){toast('Not enough coins');return}x.co-=CO;if(w.own)w.ern=(w.ern||0)+3}
 if(w.own)w.unl=(w.unl||0)+1;x.un.push(id+':'+c);sv();toast('Chapter unlocked');render()}
function claim(id){const d=QS.find(q=>q.id===id),x=u();if(x.q.cl.includes(id)||d.p(x.q)<1)return;x.tk+=d.r;x.q.cl.push(id);sv();toast('+'+d.r+' tokens');render()}
function buy(n){u().co+=n;sv();toast(n+' demo coins added');render()}
function submit(){const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,su=state.m==='su',er=$('#er');
 if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent='Enter a valid email address.';return}
 if(pw.length<6){er.textContent='Password must be at least 6 characters.';return}
 if(su){const nm=$('#nm').value.trim();if(!nm){er.textContent='Enter a display name.';return}
  if(users[em]){er.textContent='That email already has an account. Log in instead.';return}
  users[em]={name:nm,pw:btoa(pw),fav:$('#fv').value,lib:[],tk:3,co:0,un:[],q:{}}}
 else if(!users[em]||users[em].pw!==btoa(pw)){er.textContent='Email or password is incorrect.';return}
 me=em;sv();go('home')}
function out(){me=null;sv();go('home')}
function createW(){const t=$('#wt').value.trim(),d=$('#wd').value.trim(),er=$('#er');
 if(!t||!d){er.textContent='Add a title and a short synopsis.';return}
 const id='u'+Date.now();UW.push({id,t,a:u().name,g:$('#wg').value,r:0,d,m:+$('#wm').value,h:[hs(t),(hs(t)*7)%360],lock:Math.max(1,+$('#wl').value||1),own:me,chs:[],ern:0,unl:0});sv();go('mw',id)}
function addCh(){const w=gw(state.id),t=$('#ct').value.trim(),x=$('#cx').value.trim();if(!t||!x){$('#er').textContent='Add a chapter title and content.';return}w.chs.push({t,x});sv();toast('Chapter published');render()}
function setLock(){const w=gw(state.id);w.lock=Math.max(1,+$('#wl').value||1);sv();toast('Lock setting saved');render()}
$('#q').addEventListener('input',e=>{state.q=e.target.value;state.v='home';render()});
$('#tg').onclick=()=>{const d=document.documentElement,dk=matchMedia('(prefers-color-scheme:dark)').matches,cur=d.dataset.theme||(dk?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark'};
setInterval(()=>{if(me&&state.v==='read'&&state.rd&&!document.hidden){const q=u().q;q.rt++;if(q.rt%10===0){sv();$('#wl').textContent=u().tk+' tokens'}const e=$('#rt');if(e)e.textContent=fmt(q.rt)}},1000);
render();
</script>
</body>
</html>
